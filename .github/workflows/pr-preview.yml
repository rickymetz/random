name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Shared with the main deploy workflow — both push to the gh-pages branch
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
      - name: Build site
        if: github.event.action != 'closed'
        run: node scripts/build.js
      # Deploys to gh-pages:pr-preview/pr-<number>/, comments the preview URL
      # on the PR, and removes the preview when the PR closes
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
