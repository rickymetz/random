name: Regenerate hub homepage

# Pages serves the main branch directly (Settings -> Pages -> Deploy from a
# branch). This workflow keeps the generated homepage committed at the repo
# root: on each push it rebuilds index.html from the ideas/ folder and
# commits it back only when it changed, so the loop terminates immediately.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the build script can date ideas by first commit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site (writes index.html to the repo root)
        run: node scripts/build.js
      - name: Commit regenerated homepage if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Homepage unchanged"
          else
            git commit -m "Regenerate hub homepage"
            git push
          fi
