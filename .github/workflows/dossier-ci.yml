name: Dossier CI

on:
  push:
    branches: [main]
    paths: ['dossier/**']
  pull_request:
    paths: ['dossier/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dossier/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dossier/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
