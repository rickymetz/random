<!doctype html>
<!-- Served by sw.js in place of an idea that isn't cached yet. The worker
     serves it at the idea's own URL and injects <base href> pointing at the
     hub, so every relative URL below resolves against the hub root. -->
<html lang="en" data-random-page="offline">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · random</title>
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // Same look decision as the hub (modern unless retro was chosen).
  (function () {
    var look;
    try { look = JSON.parse(localStorage.getItem("random-hub:look")); } catch (e) {}
    // Modern unless someone has chosen retro.
    document.documentElement.setAttribute("data-look", look === "retro" ? "retro" : "modern");
    if (look === "retro") document.write('<link rel="stylesheet" href="retro.css">');
  })();
</script>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e2dc;
    --accent: #b3542e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --card: #1e1e1e;
      --ink: #eceae6;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --accent: #e08554;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 3rem 1.25rem 5rem;
  }
  main { max-width: 52rem; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
  header p { color: var(--muted); margin-top: 0.35rem; }
  .retry {
    margin-top: 1rem;
    border: 0;
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  h2 { font-size: 1rem; margin-bottom: 0.9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 1rem;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    padding: 1.1rem 1.2rem 1.25rem;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card-emoji { font-size: 1.3rem; display: block; margin-bottom: 0.5rem; }
  .card-emoji.has-art { width: 2.75rem; height: 2.75rem; padding: 0.2rem; border-radius: 0.7rem; background: var(--c, var(--line)); }
  .card-emoji img, .card .tile img { display: block; width: 100%; height: 100%; }
  .card h3 { font-size: 1.05rem; letter-spacing: -0.01em; }
  .card p { color: var(--muted); font-size: 0.88rem; margin-top: 0.4rem; }
  .none { color: var(--muted); }
  .signal, .card .tile { display: none; }

  /* Retro: Gingerbread's "No connection" screen, cached ideas as tiles. */
  html[data-look="retro"] body { overflow: auto; padding: 2.5rem 1rem 5rem; background: var(--rt-bg); color: var(--rt-ink); }
  html[data-look="retro"] body > main { display: block; max-width: 30rem; }
  html[data-look="retro"] header { text-align: center; }
  html[data-look="retro"] .signal { display: block; width: 72px; height: 72px; margin: 0 auto 1rem; color: var(--rt-ink-2); }
  html[data-look="retro"] h1 { font-size: 1.3rem; }
  html[data-look="retro"] header p, html[data-look="retro"] .none { color: var(--rt-ink-2); }
  html[data-look="retro"] .retry {
    border-radius: 4px; border: 1px solid #666; color: #111; font-weight: 400;
    background: linear-gradient(180deg, #f2f2f2, #c9c9c9); min-width: 9rem; min-height: 44px;
  }
  html[data-look="retro"] .retry:active { background: var(--rt-hl); }
  html[data-look="retro"] h2 { font-size: 0.9rem; color: var(--rt-hl); border-bottom: 1px solid var(--rt-line); padding-bottom: 0.4rem; }
  html[data-look="retro"] .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 4px; }
  html[data-look="retro"] .card {
    background: none; border: 0; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  html[data-look="retro"] .card .tile { display: grid; }
  html[data-look="retro"] .card-emoji, html[data-look="retro"] .card p { display: none; }
  html[data-look="retro"] .card h3 {
    font-size: 12px; font-weight: 400; max-width: 100%; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--rt-label);
  }
</style>
</head>
<body>
  <main>
    <header>
      <svg class="signal" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h3v2H2zM7 16h3v6H7zM12 12h3v10h-3zM17 7h3v15h-3z" fill="currentColor" opacity=".3"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <h1>You're offline</h1>
      <p>This idea hasn't been saved on this device yet. It will be once you open it with a connection.</p>
      <button class="retry" type="button" onclick="location.reload()">Retry</button>
    </header>
    <section>
      <h2>Available offline</h2>
      <div class="grid" id="cached"></div>
      <p class="none" id="none" hidden>Nothing yet. Ideas you open are kept here for next time.</p>
    </section>
  </main>
<script>
(function () {
  var grid = document.getElementById('cached');
  var none = document.getElementById('none');
  function at(path) { return new URL(path, document.baseURI).href; }

  // An idea counts as available when any cache on this origin holds its
  // page: the hub worker's, or an app's own (Cadence, Ledger).
  function available(idea) {
    var candidates = [idea.url, idea.slug + '/', idea.slug + '/index.html'];
    if (!('caches' in window)) return Promise.resolve(false);
    return candidates.reduce(function (found, path) {
      return found.then(function (hit) {
        return hit || caches.match(at(path), { ignoreSearch: true }).then(Boolean);
      });
    }, Promise.resolve(false));
  }

  // The worker's injected nav.js (deferred) brings the retro tile colours:
  // render once it has run, i.e. by DOMContentLoaded.
  var ready = new Promise(function (resolve) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', resolve);
    else resolve();
  });
  ready.then(function () { return fetch(at('ideas.json')); })
    .then(function (r) { return r.json(); })
    .then(function (ideas) {
      return Promise.all(ideas.map(available)).then(function (flags) {
        return ideas.filter(function (_, i) { return flags[i]; });
      });
    })
    .catch(function () { return []; })
    .then(function (list) {
      none.hidden = list.length > 0;
      list.forEach(function (idea) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = at(idea.url);
        // The idea's icon (nav.js draws it in the chosen style), else its emoji.
        var nav = window.randomNav && window.randomNav.art ? window.randomNav : null;
        var emoji = document.createElement('span');
        emoji.className = 'card-emoji';
        emoji.setAttribute('aria-hidden', 'true');
        if (idea.color) emoji.style.setProperty('--c', idea.color);
        if (nav) nav.art(emoji, idea); else emoji.textContent = idea.emoji || '✦';
        // The retro look's era tile (nav.js has the colours).
        var tile = document.createElement('span');
        tile.className = 'tile rt-tile';
        tile.setAttribute('aria-hidden', 'true');
        if (nav) nav.art(tile, idea); else tile.textContent = idea.emoji || '✦';
        var v = window.randomNav && window.randomNav.tileVars ? window.randomNav.tileVars(idea) : null;
        if (v && v.custom) { tile.classList.add('rt-custom'); tile.style.setProperty('--tile', v.custom); }
        else if (v) { tile.style.setProperty('--h', v.h); tile.style.setProperty('--dl', v.dl); }
        a.appendChild(tile);
        var h = document.createElement('h3');
        h.textContent = idea.title;
        a.appendChild(emoji);
        a.appendChild(h);
        if (idea.description) {
          var p = document.createElement('p');
          p.textContent = idea.description;
          a.appendChild(p);
        }
        grid.appendChild(a);
      });
    });
})();
</script>
</body>
</html>
