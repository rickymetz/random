<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathe</title>
<meta name="description" content="A breathing circle: box, 4-7-8, coherent, physiological sigh and more.">
<style>
  :root {
    --bg: #0e1420;
    --ink: #dce6f2;
    --muted: #6f7f95;
    --glow: #5aa9e6;
    --chip: rgba(220, 230, 242, 0.08);
    --chip-on: rgba(90, 169, 230, 0.28);
  }
  /* Registered so the sweep angle can be animated; browsers without
     @property skip the wedge/ring (see SWEEP below). */
  @property --sweep {
    syntax: "<angle>";
    inherits: true;
    initial-value: 0deg;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: grid;
    /* A second row for the hub navbar's spacer, so it doesn't pull the
       centred content up. */
    grid-template-rows: 1fr auto;
    place-items: center;
    padding: 3.5rem 16px 2rem;
  }
  main { text-align: center; max-width: 30rem; }
  /* The stage holds the breathing circle (it scales) and, with the timer
     on, a countdown ring and a big number (both fixed size). */
  .stage {
    --size: min(80vw, 46vh, 380px);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin: 0 auto 1.75rem;
    border-radius: 50%;
    cursor: pointer;
  }
  .stage:focus-visible { outline: 2px solid var(--glow); outline-offset: 6px; }
  /* Timer ring: fills once per phase; the faint track is ::before, the
     progress ::after (it inherits --sweep from the stage). */
  body.timer .stage::before,
  body.timer .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
  }
  body.timer .stage::before { background: rgba(220, 230, 242, 0.1); }
  body.timer .stage::after { background: conic-gradient(#bfe2ff var(--sweep), transparent 0); }
  .circle {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7cc0f0, var(--glow) 60%, #2b6ca8);
    box-shadow: 0 0 90px rgba(90, 169, 230, 0.45);
    transform: scale(0.6);
  }
  /* Default countdown: a wedge that sweeps around the circle once per phase */
  .circle::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(rgba(255, 255, 255, 0.2) var(--sweep), transparent 0);
  }
  body.timer .circle::after { display: none; }
  body:not(.timer) .count { display: none; }
  .count {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: calc(var(--size) * 0.24);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 2px 16px rgba(14, 40, 72, 0.6);
    pointer-events: none;
  }
  .count.small { font-size: calc(var(--size) * 0.16); }
  .phase { font-size: 1.6rem; font-weight: 500; letter-spacing: 0.04em; min-height: 1.6em; }
  body.running .phase { font-size: 2rem; }
  .hint { color: var(--muted); margin-top: 0.75rem; font-size: 0.85rem; }
  .patterns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1.25rem;
  }
  .patterns button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 999px;
    min-height: 44px;
    padding: 0.35rem 0.95rem;
    cursor: pointer;
  }
  .patterns button[aria-pressed="true"] {
    background: var(--chip-on);
    border-color: var(--glow);
  }
  .toggle {
    font: inherit;
    font-size: 0.8rem;
    color: var(--muted);
    background: none;
    border: 1px solid rgba(220, 230, 242, 0.18);
    border-radius: 999px;
    min-height: 44px;
    padding: 0.3rem 0.95rem;
    margin-top: 0.85rem;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"] { color: var(--ink); background: var(--chip-on); border-color: var(--glow); }
  .toggle:focus-visible,
  .patterns button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .about {
    margin: 1.25rem auto 0;
    padding: 1rem 1.1rem;
    max-width: 26rem;
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.5;
    background: var(--chip);
    border-radius: 14px;
  }
  .about h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.35rem; }
  .about p + p, .about ul + p { margin-top: 0.6rem; }
  .about ul { margin: 0.5rem 0 0; padding-left: 1.15rem; }
  .about .label {
    display: block;
    color: #8595ab;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.75rem;
  }
  .about .fact { color: #8595ab; }
  .about .warning {
    margin: 0.75rem 0;
    padding: 0.7rem 0.85rem;
    border-left: 3px solid #e6a23c;
    border-radius: 8px;
    background: rgba(230, 162, 60, 0.12);
  }
  .about .warning strong { display: block; color: #f0b95c; margin-bottom: 0.2rem; }
  .note { color: var(--muted); font-size: 0.72rem; margin-top: 0.75rem; }
  /* The exercise gets the screen to itself; the circle re-centres. */
  body.running .patterns,
  body.running .toggle,
  body.running .about,
  body.running .note { display: none; }
  .sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  a.back {
    position: fixed;
    top: 1rem; left: 1.25rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  a.back:hover { color: var(--ink); }
</style>
</head>
<body>
<a class="back" href="../../">← random</a>
<main>
  <div class="stage" id="stage" role="button" tabindex="0">
    <div class="circle" id="circle"></div>
    <div class="count" id="count" aria-hidden="true"></div>
  </div>
  <div class="phase" id="phase">Press anywhere to begin</div>
  <div class="hint" id="hint"></div>
  <div class="patterns" id="patterns" role="group" aria-label="Breathing pattern"></div>
  <button type="button" class="toggle" id="timerToggle" aria-pressed="false"><span aria-hidden="true">⏱</span> Show timer</button>
  <section class="about" id="about"></section>
  <p class="note">Benefits are as reported in studies and practice; evidence varies. If you feel dizzy or tingly, return to normal breathing.</p>
  <p class="sr" id="sr" role="status"></p>
</main>
<script>
  const stage = document.getElementById("stage");
  const circle = document.getElementById("circle");
  const countEl = document.getElementById("count");
  const phaseEl = document.getElementById("phase");
  const hintEl = document.getElementById("hint");
  const patternsEl = document.getElementById("patterns");
  const aboutEl = document.getElementById("about");
  const srEl = document.getElementById("sr");
  // Without registered custom properties the sweep would jump, not turn.
  const SWEEP = !!(window.CSS && CSS.registerProperty);

  // Circle sizes: SMALL is empty lungs, BIG is full.
  const SMALL = 0.6, BIG = 1.0;
  const inhale = (s, to = BIG) => ({ label: "Breathe in", s, from: SMALL, to });
  const exhale = (s) => ({ label: "Breathe out", s, from: BIG, to: SMALL });
  const hold = (s, at) => ({ label: "Hold", s, from: at, to: at });

  // `about` explains the technique, `benefits` are what practitioners and
  // studies report, `fact` is where it comes from or something notable.
  const PATTERNS = [
    {
      id: "box", name: "Box",
      hint: "4s in · 4s hold · 4s out · 4s hold",
      title: "Box breathing",
      about: "Four equal sides: breathe in, hold, breathe out, hold — each for a count of four. The holds make the rhythm easy to keep without thinking.",
      benefits: [
        "Steadies you under pressure without making you drowsy",
        "Gives a wandering mind something simple to count",
        "Can be done anywhere, eyes open, unnoticed",
      ],
      fact: "A version of “tactical breathing”: it's taught to US Navy SEALs, police and first responders, and was popularised by former SEAL commander Mark Divine.",
      phases: [inhale(4), hold(4, BIG), exhale(4), hold(4, SMALL)],
    },
    {
      id: "478", name: "4-7-8",
      hint: "4s in · 7s hold · 8s out",
      title: "4-7-8 breathing",
      about: "In through the nose for four, hold for seven, then a slow whooshing breath out through the mouth for eight. The exhale is twice as long as the inhale.",
      benefits: [
        "Popular for falling asleep",
        "Reported to ease anxiety and slow a racing heart",
        "Best kept to about four breaths when you're starting out — count at a comfortable speed; the 4:7:8 ratio matters more than the seconds",
      ],
      fact: "Popularised by integrative-medicine doctor Andrew Weil, who calls it a “natural tranquilizer for the nervous system”. It's adapted from yogic pranayama.",
      phases: [inhale(4), hold(7, BIG), exhale(8)],
    },
    {
      id: "coherent", name: "Coherent",
      hint: "5.5s in · 5.5s out · ~6 breaths a minute",
      title: "Coherent (resonance) breathing",
      about: "Smooth, unbroken breaths at about six a minute — no holds, just a slow, even tide in and out.",
      benefits: [
        "Raises heart-rate variability (HRV) — a marker of stress resilience — while you practise",
        "Studied for anxiety, depression and blood pressure",
        "Gentle enough to keep up for 10–20 minutes",
      ],
      fact: "Around six breaths a minute, breathing and heart rhythm fall into step with the blood-pressure reflex — the “resonance” that HRV-biofeedback research is built on (the exact rate varies from person to person, roughly 4.5–7 a minute). Rosary prayer and yoga mantras have been found to slow breathing to about the same rate.",
      phases: [inhale(5.5), exhale(5.5)],
    },
    {
      id: "sigh", name: "Sigh",
      hint: "2s in · 1s sip in more · 6s long out · 1s rest",
      title: "Physiological sigh",
      about: "A deep breath in through the nose, a second short sip on top to fill the lungs completely, then a long, slow breath out through the mouth.",
      benefits: [
        "Many people find even a few sighs take the edge off stress",
        "The top-up sip re-inflates tiny collapsed air sacs; the long exhale does the calming",
        "In a small 2023 Stanford trial, five minutes a day of cyclic sighing lifted positive mood more than mindfulness meditation did",
      ],
      fact: "You already do this: people sigh spontaneously every few minutes, and more often when stressed. The 2023 Stanford study (Balban, Huberman, Spiegel et al.) called the practice “cyclic sighing”.",
      phases: [
        inhale(2, 0.9),
        { label: "Sip in more", s: 1, from: 0.9, to: BIG },
        exhale(6),
        hold(1, SMALL),
      ],
    },
    {
      id: "triangle", name: "Triangle",
      hint: "4s in · 4s hold · 4s out",
      title: "Triangle breathing",
      about: "Box breathing with one corner taken off: in, hold, out — then straight into the next breath.",
      benefits: [
        "Easier than box breathing if the empty-lung hold feels uncomfortable",
        "A good first pattern for beginners and children",
        "Keeps a steady, focusing rhythm",
      ],
      fact: "Often taught in classrooms and therapy with a drawn triangle — trace one side per phase.",
      phases: [inhale(4), hold(4, BIG), exhale(4)],
    },
    {
      id: "calm", name: "Long exhale",
      hint: "4s in · 6s out",
      title: "Extended exhale",
      about: "Simply make each breath out longer than the breath in. No holds, no counting tricks.",
      benefits: [
        "Shifts the body toward rest-and-digest (parasympathetic) mode",
        "Can gently slow the heart rate",
        "Helpful before sleep, a hard conversation, or a presentation",
      ],
      fact: "Your heart naturally speeds up a little as you breathe in and slows as you breathe out (respiratory sinus arrhythmia) — so lengthening the exhale gives the slowing phase more time.",
      phases: [inhale(4), exhale(6)],
    },
    {
      id: "equal", name: "Equal",
      hint: "4s in · 4s out",
      title: "Equal breathing (sama vritti)",
      about: "Breath in and breath out the same length, smooth and even, usually through the nose.",
      benefits: [
        "Balancing — calming without being sleepy",
        "A classic way to settle in before meditation",
        "Easy to lengthen (5, 6, 8 counts) as it gets comfortable",
      ],
      fact: "Sama vritti is Sanskrit for “equal movement”; it's a basic pranayama taught in modern yoga.",
      phases: [inhale(4), exhale(4)],
    },
    {
      id: "wimhof", name: "Wim Hof",
      hint: "30 breaths · hold on empty · 15s recovery · ×3",
      title: "Wim Hof breathing",
      about: "Thirty deep, fast breaths — fully in, then just let go — followed by a breath hold on empty lungs for as long as is comfortable (tap when you need to breathe). Then one big recovery breath, held for 15 seconds. Three rounds.",
      warning: "Sit or lie down. Never do this in or near water (including before a cold plunge), while driving, or standing: the hold can end in a blackout with no urge to breathe first, and people have drowned practising it in water. Never push a hold past the first urge to breathe or any tunnel vision. Tingling and light-headedness are common; stop if you feel unwell. Skip it if you're pregnant or have epilepsy, a heart condition, high blood pressure, panic disorder or a history of fainting — ask a doctor first — and don't let children do it unsupervised.",
      benefits: [
        "Practitioners report a burst of energy, alertness and calm afterwards",
        "Studied for stress resilience and dampening inflammation",
        "Longer breath holds than you'd expect — overbreathing lowers CO₂, which delays the urge to breathe (and is also why you can pass out without warning)",
      ],
      fact: "Developed by Dutch “Iceman” Wim Hof, who pairs it with cold exposure. In a 2014 Radboud University study (Kox et al., PNAS), volunteers trained for 10 days in the breathing, cold exposure and meditation, then injected with a bacterial toxin, had fewer flu-like symptoms, a surge of adrenaline and a stronger anti-inflammatory response than untrained ones.",
      rounds: 3,
      phases: [
        ...Array.from({ length: 30 }, (_, n) => [
          // `num` replaces the countdown: count breaths, not seconds.
          { label: "In", s: 1.5, from: SMALL, to: BIG, num: n + 1 },
          { label: "Let go", s: 1.5, from: BIG, to: SMALL, num: n + 1 },
        ]).flat(),
        // Open-ended: ends on a tap, or at the cap (s) as a safety net.
        { label: "Hold", s: 180, from: SMALL, to: SMALL, open: true },
        { ...inhale(2), label: "Recovery breath in" },
        hold(15, BIG),
        { ...exhale(2), label: "Let go" },
      ],
    },
  ];

  const STORE_KEY = "breathe:pattern";
  let pattern = PATTERNS[0];
  try {
    pattern = PATTERNS.find((p) => p.id === localStorage.getItem(STORE_KEY)) || pattern;
  } catch (e) {}

  // Optional timer: a ring and big seconds number instead of the wedge.
  const TIMER_KEY = "breathe:timer";
  const timerToggle = document.getElementById("timerToggle");
  let timer = false;
  try { timer = localStorage.getItem(TIMER_KEY) === "on"; } catch (e) {}
  function setTimer(on) {
    timer = on;
    document.body.classList.toggle("timer", on);
    timerToggle.setAttribute("aria-pressed", String(on));
    try { localStorage.setItem(TIMER_KEY, on ? "on" : "off"); } catch (e) {}
  }
  timerToggle.addEventListener("click", () => setTimer(!timer));
  setTimer(timer);

  let running = false;
  let current = [];
  let ticker = 0;
  let advance = null; // set during an open-ended hold: a tap moves on

  function clearPhase() {
    for (const a of current) a.cancel();
    current = [];
    clearInterval(ticker);
    countEl.textContent = "";
    countEl.classList.remove("small");
    advance = null;
  }

  function select(p) {
    pattern = p;
    hintEl.textContent = p.hint;
    renderAbout(p);
    for (const b of patternsEl.children) {
      b.setAttribute("aria-pressed", String(b.dataset.id === p.id));
    }
    stage.setAttribute("aria-label", `Start ${p.title}`);
    try { localStorage.setItem(STORE_KEY, p.id); } catch (e) {}
  }

  // Screen readers hear each phase once — not the per-second clock or all
  // thirty Wim Hof breath counts. The alternating space makes a repeated
  // phase ("Hold") announce again.
  let flip = false;
  function announce(text) {
    flip = !flip;
    srEl.textContent = text + (flip ? " " : "");
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function warningEl(text) {
    const w = el("div", "warning", text);
    w.setAttribute("role", "note");
    const title = el("strong", "", " Safety first");
    title.prepend(el("span", "", "⚠"));
    title.firstChild.setAttribute("aria-hidden", "true");
    w.prepend(title);
    return w;
  }

  function renderAbout(p) {
    const list = el("ul");
    for (const b of p.benefits) list.appendChild(el("li", "", b));
    aboutEl.replaceChildren(
      el("h2", "", p.title),
      el("p", "", p.about),
      ...(p.warning ? [warningEl(p.warning)] : []),
      el("span", "label", "Reported benefits"),
      list,
      el("span", "label", "Notable"),
      el("p", "fact", p.fact),
    );
  }

  for (const p of PATTERNS) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.id = p.id;
    b.textContent = p.name;
    b.addEventListener("click", () => select(p));
    patternsEl.appendChild(b);
  }
  select(pattern);

  function run(i) {
    clearPhase();
    const len = pattern.phases.length;
    if (pattern.rounds && i >= pattern.rounds * len) return stop("Done — breathe normally");
    const p = pattern.phases[i % len];
    const ms = p.s * 1000;
    const round = pattern.rounds ? `Round ${Math.floor(i / len) + 1} of ${pattern.rounds}` : "";
    const next = () => { if (running) run(i + 1); };
    // Without the timer, breath counts and open holds go in the label.
    const label = (extra) => { phaseEl.textContent = timer || !extra ? p.label : `${p.label} · ${extra}`; };
    label(p.num && String(p.num));
    if (round) hintEl.textContent = round;
    if (!p.num) announce(p.open ? "Hold on empty lungs. Press Space when you need to breathe." : p.label);
    else if (p.num === 1 && p.to === BIG) announce(`${round}: 30 deep breaths`);
    const t0 = performance.now();
    let shown = "";
    const show = (text) => { if (text !== shown) countEl.textContent = shown = text; };
    const tick = () => {
      const t = performance.now() - t0;
      if (p.num) show(String(p.num));
      else if (p.open) {
        // Count up rather than down: the hold lasts as long as it's comfortable.
        const sec = Math.floor(t / 1000);
        const clock = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
        show(clock);
        if (!timer) label(clock);
      } else show(String(Math.max(1, Math.ceil((ms - t) / 1000))));
    };
    countEl.classList.toggle("small", !!p.open);
    tick();
    ticker = setInterval(tick, 200);
    if (p.open) {
      hintEl.textContent = `${round} · tap when you need to breathe`;
      stage.setAttribute("aria-label", "End the hold and breathe");
      advance = next;
    } else if (SWEEP) {
      // Linear, so the wedge (or timer ring) doubles as a countdown.
      current.push(stage.animate(
        [{ "--sweep": "0deg" }, { "--sweep": "360deg" }],
        { duration: ms, easing: "linear" }
      ));
    }
    const grow = circle.animate(
      [{ transform: `scale(${p.from})` }, { transform: `scale(${p.to})` }],
      { duration: ms, fill: "forwards", easing: "ease-in-out" }
    );
    grow.onfinish = next;
    if (!p.open) stage.setAttribute("aria-label", "Stop");
    current.push(grow);
  }

  function start() {
    running = true;
    document.body.classList.add("running");
    // Tuck the hub's navbar away for the exercise (a handle at the bottom
    // edge brings it back).
    if (window.randomNav) window.randomNav.hide();
    // The picker is about to vanish; don't leave focus inside it.
    if (document.activeElement && document.activeElement !== document.body) stage.focus();
    run(0);
  }

  function stop(message = "Press anywhere to begin") {
    running = false;
    document.body.classList.remove("running");
    clearPhase();
    phaseEl.textContent = message;
    hintEl.textContent = pattern.hint;
    stage.setAttribute("aria-label", `Start ${pattern.title}`);
    announce(message === "Press anywhere to begin" ? "Stopped" : message);
    if (window.randomNav) window.randomNav.show();
  }

  function act() {
    if (advance) advance();
    else if (running) stop();
    else start();
  }

  // Tap anywhere to start; tap again to stop and pick another pattern
  // (or, during an open-ended hold, to breathe again). A click, not a
  // pointerdown, so scrolls, swipes and pinches don't count; taps on the
  // card are for reading and selecting text.
  document.body.addEventListener("click", (e) => {
    if (e.target.closest("button, a, .about, .note")) return;
    act();
  });
  // Space/Enter do the same from the keyboard, unless a button has focus.
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && running) stop();
    else if ((e.key === " " || e.key === "Enter") && !e.repeat && !e.target.closest("button, a")) {
      e.preventDefault();
      act();
    }
  });
</script>
</body>
</html>
