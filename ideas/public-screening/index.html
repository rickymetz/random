      $(row.el).innerHTML = items.map((c) =>
        `<button class="coll" data-c="${c.i}" aria-pressed="false">` +
        `${esc(c.label)}<span class="n">${c.n}</span></button>`).join("");
      $(row.el).onclick = onPresetClick;
      $(row.el).parentElement.hidden = items.length === 0;
    }
  }

  new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) drawMore();
  }, { rootMargin: "600px" }).observe($("sentinel"));

  // ------------------------------------------------------------------ boot
  fetch("data.json")
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((data) => {
      ALL = data.movies;
      ALL.forEach((m, i) => {
        m._i = i;
        m.genres = m.genres || [];
        m.sort = m.sort || m.title.toLowerCase();
      });

      const counts = {}, decades = new Set();
      for (const m of ALL) {
        for (const g of m.genres) counts[g] = (counts[g] || 0) + 1;
        if (m.year) decades.add(m.year < 1930 ? 1900 : Math.floor(m.year / 10) * 10);
      }
      buildChips(counts);
      buildHistogram();
      buildRails();

      // A list of 439 names is not a browsable thing; the 93 with more than
      // one film here are. Ordered by how much of the catalogue they account
      // for, since that is what makes one worth opening.
      const dirCount = {};
      for (const m of ALL) for (const d of m.director || []) dirCount[d] = (dirCount[d] || 0) + 1;
      const browsable = Object.entries(dirCount).filter(([, n]) => n > 1)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      // Same rule as directors: a name with one film is not a thing to browse,
      // and 146 of these appear in more than one.
      const castCount = {};
      for (const m of ALL) for (const c of m.cast || []) castCount[c] = (castCount[c] || 0) + 1;
      $("actor").insertAdjacentHTML("beforeend",
        Object.entries(castCount).filter(([, n]) => n > 1)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([c, n]) => `<option value="${esc(c)}">${esc(c)} (${n})</option>`).join(""));

      $("director").insertAdjacentHTML("beforeend",
        browsable.map(([d, n]) => `<option value="${esc(d)}">${esc(d)} (${n})</option>`).join(""));
      // URL first so a shared link always wins; saved preferences only fill in
      // a bare visit.
      if (!readUrl()) loadPrefs();

      // The whole silent era in one option: it spans several decade buckets and
      // is the distinctive part of this catalogue.
      $("decade").insertAdjacentHTML("beforeend",
        `<option value="silent">Silent era, to 1930</option>`);
      $("decade").insertAdjacentHTML("beforeend",
        [...decades].sort((a, b) => a - b)
          .map((d) => `<option value="${d}">${d === 1900 ? "Before 1930" : d + "s"}</option>`).join(""));

      // A hand-edited or stale hash can name a decade this build no longer
      // has (or never did). Left alone, the select would show "Any" while
      // state.decade stayed truthy — filtered results with no visible filter.
      const validDecades = new Set(["silent", ...[...decades].map(String)]);
      if (state.decade && !validDecades.has(state.decade)) state.decade = "";

      const rated = ALL.filter((m) => m.score || m.rating).length;
      const siteOnly = ALL.filter((m) => !m.score && m.rating).length;
      for (const o of $("minRating").options) {
        if (o.value === "rated") o.textContent = `Rated, any score (${rated})`;
        if (o.value === "site") o.textContent = `Site stars only (${siteOnly})`;
        if (o.value === "unrated") o.textContent = `Unrated (${ALL.length - rated})`;
      }

      const withArt = ALL.filter((m) => m.art).length;
      $("hasArt").nextElementSibling.textContent = `Has poster (${withArt})`;
      const watchable = ALL.filter((m) => m.ia).length;
      $("canWatch").nextElementSibling.textContent = `Watchable (${watchable})`;
      const withYear = ALL.filter((m) => m.year).length;
      $("footer").innerHTML =
        `Catalogue of ${ALL.length} public domain films scraped from ` +
        `<a href="${SRC}/nshowcat.html?category=ALL" target="_blank" rel="noopener noreferrer">publicdomaintorrents.info</a> ` +
        `on ${esc(data.scraped)}. Years for ${withYear} of them and ${withArt} ${withArt === 1 ? "poster" : "posters"} come from ` +
        `<a href="https://www.wikidata.org" target="_blank" rel="noopener noreferrer">Wikidata</a>, ` +
        `<a href="https://fanart.tv" target="_blank" rel="noopener noreferrer">fanart.tv</a> and ` +
        `<a href="https://thetvdb.com" target="_blank" rel="noopener noreferrer">TheTVDB</a>; ` +
        `the rest get a drawn poster. Titles are matched by name alone, so a few posters and years will belong to the wrong film.`;

      // Read this before writeUrl: with no film open yet, writeUrl drops the
      // film param, so reading afterwards always found nothing and a shared
      // link never opened its film on a real page load.
      const startId = new URLSearchParams(location.hash.replace(/^#/, "")).get("film");
      const startFilm = startId && ALL.find((m) => m.id === startId);

      syncControls();
      render();
      writeUrl(false);

      if (startFilm) openDrawer(startFilm, { push: false });
    })
    .catch((err) => {
      grid.innerHTML = "";
      empty.hidden = false;
      empty.innerHTML = `<p>Could not load the catalogue (${esc(err.message)}).</p>` +
        `<p class="d-line">This page needs to be served over http — opening the file directly blocks the data fetch.</p>`;
      countEl.textContent = "—";
    });
})();
</script>
</body>
</html>
