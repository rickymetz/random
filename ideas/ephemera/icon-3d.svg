      <stop offset="1" stop-color="#9abeb6"/>
    </linearGradient>
    <filter id="ephemera-3d-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="ephemera-3d-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <ellipse cx="66" cy="109" rx="46" ry="6" fill="#275248" opacity=".6" filter="url(#ephemera-3d-blur)"/>
  <path d="M36 40 L40 62 M76 40 L72 62" stroke="url(#ephemera-3d-ink)" stroke-width="5.5" stroke-linecap="round"/>
  <rect x="24" y="98" width="10" height="9" rx="3" fill="url(#ephemera-3d-ink)"/>
  <rect x="78" y="98" width="10" height="9" rx="3" fill="url(#ephemera-3d-ink)"/>
  <rect x="92" y="70" width="15" height="22" rx="4" fill="url(#ephemera-3d-ink)"/>
  <rect x="18" y="60" width="76" height="42" rx="11" fill="url(#ephemera-3d-body)"/>
  <path d="M28 64 H70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".3" filter="url(#ephemera-3d-soft)"/>
  <rect x="104" y="65" width="9" height="32" rx="4.5" fill="url(#ephemera-3d-lens)"/>
  <rect x="105.5" y="68" width="3" height="14" rx="1.5" fill="#ffffff" opacity=".9"/>
