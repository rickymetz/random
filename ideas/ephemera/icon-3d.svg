    <circle cx="76" cy="38" r="18" fill="url(#ephemera-3d-reel)"/>
  </g>
  <g fill="url(#ephemera-3d-hole)">
    <circle cx="36" cy="28" r="5"/><circle cx="27.3" cy="43" r="5"/><circle cx="44.7" cy="43" r="5"/>
    <circle cx="76" cy="28" r="5"/><circle cx="67.3" cy="43" r="5"/><circle cx="84.7" cy="43" r="5"/>
