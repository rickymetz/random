<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ephemera: vintage film projector with two reels, soft clay -->
  <defs>
    <radialGradient id="ephemera-3d-reel" cx=".32" cy=".28" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fff3dc"/>
      <stop offset="1" stop-color="#a0c5bd"/>
    </radialGradient>
    <radialGradient id="ephemera-3d-body" cx=".3" cy=".2" r=".95">
      <stop offset="0" stop-color="#5e5650"/>
      <stop offset=".5" stop-color="#2a2623"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </radialGradient>
    <linearGradient id="ephemera-3d-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4843"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="ephemera-3d-hole" cx=".6" cy=".65" r=".7">
      <stop offset="0" stop-color="#5fb3a1"/>
      <stop offset="1" stop-color="#367163"/>
