<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ephemera</title>
<!--
  The "8,038" item count below is hardcoded copy, not derived from data.json.
  It goes stale whenever build-data.mjs is re-run against a refreshed Prelinger
  scrape. Before shipping, check it against data.json's top-level "count" field
  (and items.length) and update every occurrence below if they've drifted.
-->
<meta name="description" content="Browse 8,038 industrial, educational and advertising films from the Prelinger Archives, and watch them in the page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181d'/%3E%3Crect x='9' y='5' width='14' height='22' rx='1.5' fill='%235fb3a1'/%3E%3Cg fill='%2316181d'%3E%3Crect x='10.5' y='7' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='10.5' y='11.5' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='10.5' y='16' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='10.5' y='20.5' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='19' y='7' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='19' y='11.5' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='19' y='16' width='2.5' height='2.5' rx='.6'/%3E%3Crect x='19' y='20.5' width='2.5' height='2.5' rx='.6'/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="random">
<meta property="og:title" content="Ephemera">
<meta property="og:description" content="Browse 8,038 industrial, educational and advertising films from the Prelinger Archives, and watch them in the page.">
<meta property="og:url" content="https://rickymetz.github.io/random/ideas/ephemera/">
<meta property="og:image" content="https://rickymetz.github.io/random/ideas/ephemera/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ephemera — a grid of vintage film frames">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ephemera">
<meta name="twitter:description" content="Browse 8,038 industrial, educational and advertising films. Watch them without leaving the page.">
<meta name="twitter:image" content="https://rickymetz.github.io/random/ideas/ephemera/og.png">
<style>
  :root {
    --bg: #16181d;
    --bg-2: #1c1f26;
    --panel: #21252e;
    --line: #2e333e;
    --line-2: #3a4150;
    --ink: #e8eaf0;
    --muted: #8b93a5;
    --dim: #858da1;
    --accent: #5fb3a1;         /* teal — distinct from Public Screening's amber */
    --accent-ink: #0c211c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 6px;
    --shadow: 0 6px 20px rgb(0 0 0 / 0.45);
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ------------------------------------------------------------- header */
  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg-2) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
    max-width: 1600px;
    margin: 0 auto;
    padding: 12px 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .home {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
    margin-left: -5px;
    padding: 5px 6px;
    border-radius: var(--radius);
    color: var(--muted);
    text-decoration: none;
  }
  .home:hover { color: var(--ink); background: var(--panel); }
  .home:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .search {
    position: relative;
    justify-self: stretch;
    max-width: 420px;
  }
  .search svg {
    position: absolute;
    left: 10px;
    top: 50%;
    translate: 0 -50%;
    color: var(--dim);
    pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 34px;
    padding: 0 66px 0 32px;
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    color: var(--ink);
    font: 14px var(--sans);
  }
  .search input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search input::placeholder { color: var(--dim); }
  .search-end {
    position: absolute;
    right: 9px;
    top: 50%;
    translate: 0 -50%;
    display: flex;
    align-items: center;
    gap: 5px;
    pointer-events: none;
  }
  .count {
    font: 10px var(--mono);
    line-height: 1;
    color: var(--dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .view-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-self: end;
  }
  #sort {
    height: 30px;
    padding: 0 8px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    color: var(--ink);
    font: 12px var(--sans);
  }
  .view-toggle { display: flex; gap: 0; }
  .view-toggle button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 30px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    color: var(--muted);
    cursor: pointer;
  }
  .view-toggle button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .view-toggle button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: 0; }
  .view-toggle button[aria-pressed="true"] { background: var(--line-2); color: var(--ink); }

  /* --------------------------------------------------------------- grid */
  main {
    max-width: 1600px;
    margin: 0 auto;
    padding: 18px 20px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 22px 16px;
  }
  .card-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .poster {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--panel);
    box-shadow: 0 2px 8px rgb(0 0 0 / .4);
    transition: outline-color .12s, translate .12s;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .card-wrap:hover .poster,
  .card:focus-visible ~ .poster {
    outline-color: var(--accent);
    translate: 0 -3px;
  }
  .card:focus-visible { outline: none; }
  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Generated poster, used when no art exists (or the art 404s). */
  .gen {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 14px 12px 12px;
    background: linear-gradient(160deg, hsl(var(--h) 32% 26%), hsl(var(--h2) 38% 13%));
  }
  .gen[hidden] { display: none; }
  .gen::before {
    /* sprocket holes — a film-strip edge, drawn not downloaded */
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 13px;
    background:
      repeating-linear-gradient(to bottom, transparent 0 7px, rgb(0 0 0 / .5) 7px 14px);
    border-right: 1px solid rgb(255 255 255 / .07);
  }
  .gen .initial {
    align-self: start;
    justify-self: end;
    font: 700 40px/1 var(--mono);
    color: rgb(255 255 255 / .1);
    letter-spacing: -0.04em;
  }
  .gen .t {
    font-size: 13px;
    font-weight: 650;
    line-height: 1.25;
    color: rgb(255 255 255 / .92);
    text-wrap: balance;
    padding-left: 6px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }

  .badge {
    position: absolute;
    top: 6px;
    left: 6px;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgb(0 0 0 / .72);
    font: 10px var(--mono);
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .meta { min-width: 0; }
  .meta .name {
    font-size: 13px;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .meta .sub {
    margin-top: 2px;
    font: 11px var(--mono);
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* --------------------------------------------------------------- list */
  .grid.list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .grid.list .card-wrap {
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .grid.list .card-wrap:hover { background: var(--bg-2); }
  .grid.list .poster { width: 34px; flex: none; }
  .grid.list .card-wrap:hover .poster { translate: 0; outline-color: transparent; }
  .grid.list .gen .initial, .grid.list .badge { display: none; }
  .grid.list .gen .t { font-size: 0; }
  .grid.list .meta {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 14px;
    align-items: center;
  }
  .grid.list .meta .name { -webkit-line-clamp: 1; font-size: 14px; }
  .grid.list .meta .sub { margin: 0; }
  @media (max-width: 640px) {
    .grid.list .meta { grid-template-columns: 1fr auto; }
  }

  .empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty p { margin: 0; }

  .sentinel { height: 1px; }

  @media (max-width: 760px) {
    header { position: static; }
    .bar { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
    .brand { grid-row: 1; grid-column: 1; }
    .brand h1 { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
    .view-actions { grid-row: 1; grid-column: 2; justify-self: end; }
    .search { grid-row: 2; grid-column: 1 / -1; max-width: none; }
    .search input { height: 40px; }
    .home { min-height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; margin-left: -8px; }
    .view-toggle button { width: 40px; height: 38px; }

    .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 18px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <a class="home" href="../../" aria-label="Back to random" title="Back to random">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 7.2L8 2.5l5.5 4.7"/>
          <path d="M3.8 8.3V13h8.4V8.3"/>
        </svg>
      </a>
      <h1>Ephemera</h1>
    </div>
    <div class="search" id="searchWrap">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="Search titles, descriptions, tags…" autocomplete="off" spellcheck="false" aria-label="Search titles, descriptions, tags">
      <div class="search-end">
        <output class="count" id="count" for="q" aria-live="polite">…</output>
      </div>
    </div>
    <div class="view-actions">
      <select id="sort" aria-label="Sort">
        <option value="-n">Most viewed</option>
        <option value="-year">Newest</option>
        <option value="year">Oldest</option>
        <option value="title">Title A–Z</option>
      </select>
      <div class="view-toggle">
        <button id="viewGrid" aria-pressed="true" aria-label="Grid view" title="Grid view">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/>
            <rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
          </svg>
        </button>
        <button id="viewList" aria-pressed="false" aria-label="List view" title="List view">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M2 4h12M2 8h12M2 12h12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="empty" id="empty" hidden>
    <p>Nothing matches your search.</p>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IA = "https://archive.org";
const grid = $("grid"), countEl = $("count"), empty = $("empty");

let ALL = [], TAGS = [], shown = [], drawn = 0;
const PAGE = 120;
const state = { q: "", tags: new Set(), decade: "", sort: "-n", view: "grid", favOnly: false };

const SORTS = {
  "-n": (a, b) => (b.n || 0) - (a.n || 0),
  "year": (a, b) => (a.y || 9999) - (b.y || 9999),
  "-year": (a, b) => (b.y || 0) - (a.y || 0),
  "title": (a, b) => a.sort.localeCompare(b.sort),
};

function matches(m) {
  if (state.q) {
    const q = state.q.toLowerCase();
    if (m._hay === undefined) {
      const hay = [m.t, m.d || "", (m.g || []).join(" ")].join(" ").toLowerCase();
      Object.defineProperty(m, "_hay", { value: hay, enumerable: false, writable: true, configurable: true });
    }
    if (!m._hay.includes(q)) return false;
  }
  return true;
}

const isFiltered = () => Boolean(state.q || state.tags.size || state.decade || state.favOnly);

const PREFS = "ephemera:prefs";

function writeUrl(push) {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.sort !== "-n") p.set("sort", state.sort);
  if (state.view !== "grid") p.set("v", state.view);
  const hash = p.toString();
  const url = location.pathname + (hash ? "#" + hash : "");
  if (push && url !== location.pathname + location.hash) history.pushState(null, "", url);
  else history.replaceState(null, "", url);
}

function readUrl() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (!p.toString()) return false;
  state.q = p.get("q") || "";
  state.sort = SORTS[p.get("sort")] ? p.get("sort") : "-n";
  state.view = p.get("v") === "list" ? "list" : "grid";
  return true;
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS, JSON.stringify({ sort: state.sort, view: state.view }));
  } catch {}
}

function loadPrefs() {
  try {
    const v = JSON.parse(localStorage.getItem(PREFS) || "null");
    if (!v) return;
    if (SORTS[v.sort]) state.sort = v.sort;
    state.view = v.view === "list" ? "list" : "grid";
  } catch {}
}

function syncControls() {
  $("q").value = state.q;
  $("sort").value = state.sort;
}

function apply(push = false) {
  writeUrl(push);
  savePrefs();
  render();
}

let debounce;
$("q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = e.target.value.trim(); apply(false); }, 120);
});
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; apply(true); });
window.addEventListener("popstate", () => { if (!readUrl()) loadPrefs(); syncControls(); render(); });

// Stable hue per title so a film's generated poster never changes colour.
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}

function posterHTML(m) {
  const src = `${IA}/services/img/${encodeURIComponent(m.id)}`;
  const h = hash(m.t) % 360;
  // A thumbnail URL is always present, so the drawn fallback starts hidden —
  // this keeps its title out of the accessibility tree while the real
  // thumbnail is showing. window.__posterFailed unhides it if the image
  // 404s or otherwise fails to load.
  return `<div class="poster">` +
    `<div class="gen" hidden style="--h:${h};--h2:${(h + 42) % 360}"><span class="t">${esc(m.t)}</span></div>` +
    `<img src="${esc(src)}" alt="" loading="lazy" decoding="async"
          onerror="window.__posterFailed(this)">` +
    (m.y ? `<span class="badge">${m.y}</span>` : "") +
  `</div>`;
}

// A thumbnail can fail to load for any number of reasons — the item has no
// derived image yet, the host is down, an extension blocked it. Whatever the
// cause, drop the broken <img> and reveal the drawn fallback in its place.
window.__posterFailed = (img) => {
  img.closest(".poster")?.querySelector(".gen")?.removeAttribute("hidden");
  img.remove();
};

function cardHTML(m, i) {
  const sub = [m.y, m.n != null ? m.n.toLocaleString() + " views" : null].filter(Boolean).join(" · ");
  return `<div class="card-wrap">` +
    `<button class="card" data-i="${i}" aria-label="Open ${esc(m.t)}"></button>` +
    posterHTML(m) +
    `<span class="meta">` +
      `<span class="name">${esc(m.t)}</span>` +
      `<span class="sub">${esc(sub)}</span>` +
    `</span>` +
  `</div>`;
}

function drawMore() {
  if (drawn >= shown.length) return;
  const next = shown.slice(drawn, drawn + PAGE);
  grid.insertAdjacentHTML("beforeend", next.map((m) => cardHTML(m, m._i)).join(""));
  drawn += next.length;
}

function render() {
  shown = ALL.filter(matches).sort(SORTS[state.sort]);
  grid.className = "grid" + (state.view === "list" ? " list" : "");
  grid.innerHTML = "";
  drawn = 0;
  drawMore();
  empty.hidden = shown.length > 0;
  countEl.textContent = `${shown.length} / ${ALL.length}`;
  $("viewGrid").setAttribute("aria-pressed", String(state.view === "grid"));
  $("viewList").setAttribute("aria-pressed", String(state.view === "list"));
}

new IntersectionObserver((e) => { if (e[0].isIntersecting) drawMore(); })
  .observe($("sentinel"));

$("viewGrid").onclick = () => { state.view = "grid"; apply(true); };
$("viewList").onclick = () => { state.view = "list"; apply(true); };

fetch("data.json")
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then((data) => {
    ALL = data.items;
    TAGS = data.tags;
    ALL.forEach((m, i) => { m._i = i; });
    if (!readUrl()) loadPrefs();
    syncControls();
    render();
    writeUrl(false);
  })
  .catch((err) => {
    grid.innerHTML = `<p class="err">Could not load the catalogue (${esc(err.message)}).</p>`;
  });
</script>
</body>
</html>
